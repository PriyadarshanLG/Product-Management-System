<div class="app-shell flex min-h-screen bg-[var(--canvas)] text-[var(--ink)]">
  <aside class="app-sidebar sticky top-0 flex h-screen w-64 shrink-0 flex-col border-r border-[#e3e9e5] bg-white px-5 py-6">
    <a routerLink="/dashboard" class="mb-10 flex items-center gap-3 no-underline">
      <span class="brand-mark flex h-10 w-10 items-center justify-center text-base font-extrabold">G</span>
      <span>
        <span class="block text-[17px] font-bold leading-tight tracking-[-0.02em] text-[#1e2b26]">Gupio</span>
        <span class="mt-1 block text-[10px] font-semibold uppercase tracking-[0.12em] text-[#77847d]">Inventory workspace</span>
      </span>
    </a>

    <p class="mb-3 px-3 text-[10px] font-bold uppercase tracking-[0.12em] text-[#929e97]">Workspace</p>
    <nav class="flex flex-col gap-1" aria-label="Main navigation">
      <a routerLink="/dashboard" routerLinkActive="nav-active" class="nav-link">
        <svg class="h-[18px] w-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3.75 4.75h6.5v6.5h-6.5zm10 0h6.5v6.5h-6.5zm-10 10h6.5v6.5h-6.5zm10 0h6.5v6.5h-6.5z"/></svg>
        <span>Overview</span>
      </a>
      <a routerLink="/products" routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
        <svg class="h-[18px] w-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5zm0 0 8 4.5m8-4.5-8 4.5m0 0V21"/></svg>
        <span>Products</span>
      </a>
    </nav>

    <div class="mt-auto border-t border-[#e8ede9] pt-5">
      <a routerLink="/products/new" class="flex items-center justify-center gap-2 rounded-md bg-[#17634c] px-4 py-2.5 text-sm font-semibold text-white no-underline transition hover:bg-[#124b3a]">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m7-7H5"/></svg>
        <span>Add product</span>
      </a>
    </div>
  </aside>

  <div class="app-main flex min-h-screen min-w-0 flex-1 flex-col">
    <header class="flex h-[62px] shrink-0 items-center justify-between border-b border-[#e3e9e5] bg-white px-6 md:px-9">
      <div class="flex items-center gap-2 text-xs text-[#718078]">
        <span>Workspace</span>
        <svg class="h-3.5 w-3.5 text-[#a3aea7]" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 18 6-6-6-6"/></svg>
        <span class="font-semibold text-[#35443c]">Inventory operations</span>
      </div>
    </header>

    <main class="mx-auto w-full max-w-screen-2xl flex-1 px-5 py-7 sm:px-7 lg:px-10 lg:py-9">
      <router-outlet></router-outlet>
    </main>
    <footer class="border-t border-[#e3e9e5] px-6 py-4 text-center text-[11px] text-[#849088] md:px-9 md:text-left">
      Gupio Inventory Workspace <span class="mx-1.5 text-[#c0c9c3]">·</span> Product operations
    </footer>
  </div>

  <app-toast></app-toast>
</div>
